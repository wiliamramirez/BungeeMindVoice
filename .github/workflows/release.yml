name: Build and release voice binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
          - target: windows-x86_64
            runner: windows-2025
          - target: windows-arm64
            runner: windows-11-arm
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      BMV_VERSION: ${{ github.event_name == 'push' && github.ref_name || format('workflow-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MSYS
          update: true
          install: make
      - if: runner.os == 'Windows'
        run: python -m unittest discover -s tests
      - if: runner.os != 'Windows'
        run: python3 -m unittest discover -s tests
      - if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build-windows.cmd ${{ matrix.target }} ${{ matrix.target == 'windows-arm64' && 'ARM64' || 'x64' }} ${{ runner.arch == 'ARM64' && 'ARM64' || 'x64' }}
      - if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/build.py --target "${{ matrix.target }}" --output "dist/${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          pattern: "*"
          merge-multiple: true
      - run: python3 scripts/create_manifest.py --directory dist --version "${GITHUB_REF_NAME}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.tar.gz dist/manifest.json --title "BungeeMind Voice ${GITHUB_REF_NAME}" --notes "Portable BungeeMind voice binaries. See manifest.json and included licenses."
